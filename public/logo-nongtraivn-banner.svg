<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fed7aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>

    <!-- Sunflower petals -->
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fde047;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>

    <!-- Sunflower center -->
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#92400e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#451a03;stop-opacity:1" />
    </radialGradient>

    <!-- Carrot gradient -->
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>

    <!-- House gradients -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="180" fill="url(#bgGrad)" rx="24"/>

  <!-- Decorative border -->
  <rect x="2" y="2" width="596" height="176" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" rx="22" opacity="0.4"/>

  <!-- Clouds -->
  <g opacity="0.7">
    <ellipse cx="80" cy="30" rx="22" ry="8" fill="#fff"/>
    <ellipse cx="95" cy="27" rx="14" ry="6" fill="#fff"/>
    <ellipse cx="500" cy="25" rx="20" ry="7" fill="#fff"/>
    <ellipse cx="515" cy="22" rx="12" ry="5" fill="#fff"/>
  </g>

  <!-- House (left side, small) -->
  <g transform="translate(20, 90)" filter="url(#shadow)">
    <rect x="0" y="20" width="50" height="40" fill="url(#wallGrad)" stroke="#92400e" stroke-width="1.5"/>
    <polygon points="-6,20 25,0 56,20" fill="url(#roofGrad)" stroke="#7f1d1d" stroke-width="1.5"/>
    <rect x="18" y="38" width="14" height="22" fill="#7c2d12" stroke="#451a03" stroke-width="1"/>
    <circle cx="29" cy="50" r="1" fill="#fde047"/>
    <rect x="4" y="28" width="10" height="10" fill="#7dd3fc" stroke="#0369a1" stroke-width="0.8"/>
    <line x1="9" y1="28" x2="9" y2="38" stroke="#0369a1" stroke-width="0.6"/>
    <line x1="4" y1="33" x2="14" y2="33" stroke="#0369a1" stroke-width="0.6"/>
    <rect x="36" y="28" width="10" height="10" fill="#7dd3fc" stroke="#0369a1" stroke-width="0.8"/>
    <line x1="41" y1="28" x2="41" y2="38" stroke="#0369a1" stroke-width="0.6"/>
    <line x1="36" y1="33" x2="46" y2="33" stroke="#0369a1" stroke-width="0.6"/>
    <circle cx="40" cy="-2" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="44" cy="-8" r="2" fill="#fff" opacity="0.6"/>
  </g>

  <!-- Chicken (right bottom) -->
  <g transform="translate(490, 110)" filter="url(#shadow)">
    <ellipse cx="18" cy="15" rx="16" ry="12" fill="#fff" stroke="#1f2937" stroke-width="1.2"/>
    <ellipse cx="22" cy="17" rx="9" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="0.8"/>
    <circle cx="8" cy="6" r="9" fill="#fff" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M 2,0 Q 4,-5 7,-3 Q 9,-7 12,-3 Q 14,-5 16,-1" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.8"/>
    <polygon points="0,7 -5,9 0,11" fill="#f59e0b" stroke="#92400e" stroke-width="0.6"/>
    <circle cx="5" cy="5" r="1.6" fill="#1f2937"/>
    <circle cx="5.5" cy="4.5" r="0.5" fill="#fff"/>
    <path d="M 33,12 Q 42,2 38,18 Q 44,14 36,22" fill="#fef3c7" stroke="#1f2937" stroke-width="0.8"/>
    <line x1="13" y1="25" x2="13" y2="30" stroke="#f59e0b" stroke-width="1.2"/>
    <line x1="22" y1="25" x2="22" y2="30" stroke="#f59e0b" stroke-width="1.2"/>
  </g>

  <!-- Carrot (left bottom corner) -->
  <g transform="translate(80, 130)" filter="url(#shadow)">
    <path d="M 0,0 L 22,0 L 11,32 Z" fill="url(#carrotGrad)" stroke="#9a3412" stroke-width="1.2"/>
    <line x1="6" y1="4" x2="6" y2="12" stroke="#9a3412" stroke-width="0.6"/>
    <line x1="11" y1="2" x2="11" y2="18" stroke="#9a3412" stroke-width="0.6"/>
    <line x1="16" y1="4" x2="16" y2="12" stroke="#9a3412" stroke-width="0.6"/>
    <ellipse cx="7" cy="-5" rx="3" ry="7" fill="url(#leafGrad)" stroke="#15803d" stroke-width="0.8" transform="rotate(-25 7 -5)"/>
    <ellipse cx="11" cy="-7" rx="3" ry="8" fill="url(#leafGrad)" stroke="#15803d" stroke-width="0.8"/>
    <ellipse cx="15" cy="-5" rx="3" ry="7" fill="url(#leafGrad)" stroke="#15803d" stroke-width="0.8" transform="rotate(25 15 -5)"/>
  </g>

  <!-- Sunflower mascot (left of text) -->
  <g transform="translate(160, 90)" filter="url(#shadow)">
    <!-- Stem -->
    <rect x="-3" y="28" width="6" height="55" fill="#16a34a" stroke="#15803d" stroke-width="0.8"/>
    <ellipse cx="10" cy="50" rx="8" ry="4" fill="url(#leafGrad)" stroke="#15803d" stroke-width="0.8" transform="rotate(30 10 50)"/>

    <!-- Petals -->
    <g>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(30)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(60)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(90)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(120)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(150)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(180)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(210)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(240)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(270)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(300)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="18" fill="url(#petalGrad)" stroke="#d97706" stroke-width="1" transform="rotate(330)"/>
    </g>

    <!-- Face -->
    <circle cx="0" cy="0" r="20" fill="url(#centerGrad)" stroke="#451a03" stroke-width="1.5"/>
    <circle cx="-7" cy="-4" r="2.5" fill="#fff"/>
    <circle cx="7" cy="-4" r="2.5" fill="#fff"/>
    <circle cx="-7" cy="-4" r="1.4" fill="#1f2937"/>
    <circle cx="7" cy="-4" r="1.4" fill="#1f2937"/>
    <circle cx="-6.5" cy="-4.5" r="0.5" fill="#fff"/>
    <circle cx="7.5" cy="-4.5" r="0.5" fill="#fff"/>
    <ellipse cx="-10" cy="3" rx="3" ry="1.5" fill="#fb7185" opacity="0.7"/>
    <ellipse cx="10" cy="3" rx="3" ry="1.5" fill="#fb7185" opacity="0.7"/>
    <path d="M -6,4 Q 0,10 6,4" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Text: NôngTr¡iVN -->
  <g filter="url(#textShadow)">
    <!-- Main text "NôngTr¡i" -->
    <text x="250" y="85" font-family="'Fredoka', 'Arial Black', sans-serif" font-size="44" font-weight="800" fill="url(#textMain)" letter-spacing="1">
      <1 NôngTr¡i
    </text>
    <!-- VN accent -->
    <text x="250" y="135" font-family="'Fredoka', 'Arial Black', sans-serif" font-size="56" font-weight="900" fill="url(#textAccent)" letter-spacing="2">
      VN
      <tspan font-size="24" fill="#16a34a" dx="8">.online</tspan>
    </text>
  </g>

  <!-- Decorative leaf on text -->
  <g transform="translate(540, 70)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="10" ry="5" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1" transform="rotate(-30)"/>
  </g>

  <!-- Sparkles around -->
  <g fill="#fde047">
    <path d="M 200,40 L 202,46 L 208,48 L 202,50 L 200,56 L 198,50 L 192,48 L 198,46 Z"/>
    <path d="M 480,80 L 482,86 L 488,88 L 482,90 L 480,96 L 478,90 L 472,88 L 478,86 Z"/>
    <path d="M 450,150 L 451,153 L 454,154 L 451,155 L 450,158 L 449,155 L 446,154 L 449,153 Z"/>
    <path d="M 230,150 L 231,153 L 234,154 L 231,155 L 230,158 L 229,155 L 226,154 L 229,153 Z"/>
  </g>
</svg>
